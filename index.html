<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Começa agora — vídeo motivacional de 15s</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff4e6;--night:#0f1030;--dawn:#ff7a3d;--gold:#ffc85c;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0f1030;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
#stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:linear-gradient(#0f1030 0%,#2a1a4a 100%)}
#sky{position:absolute;inset:0;opacity:0;background:linear-gradient(#ff7a3d 0%,#ffc85c 70%,#fff0c4 100%)}
#sun{position:absolute;left:50%;bottom:0;width:70vmin;max-width:340px;aspect-ratio:1;border-radius:50%;
 background:radial-gradient(circle,#fffbe8 0%,#ffd77a 55%,#ff9a4a 100%);transform:translate(-50%,85%);box-shadow:0 0 120px 40px rgba(255,170,80,.45)}
#ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:#0f1030;clip-path:polygon(0 40%,18% 22%,36% 38%,58% 12%,80% 34%,100% 20%,100% 100%,0 100%)}
#text{position:absolute;inset:0;display:grid;place-items:center;padding:0 8%;text-align:left}
.line{grid-area:1/1;font-weight:800;font-size:clamp(2.2rem,10vw,3.6rem);line-height:1.05;letter-spacing:-.02em;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s;max-width:100%}
.line small{display:block;margin-top:.7em;font-size:.38em;font-weight:400;letter-spacing:0;opacity:.8}
.line.on{opacity:1;transform:none}
#bar{position:absolute;left:0;top:env(safe-area-inset-top,0px);height:4px;width:0;background:var(--ink)}
#replay{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);padding:.8em 1.6em;border:2px solid #0f1030;border-radius:99px;background:transparent;color:#0f1030;font:inherit;font-weight:800;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s}
#replay.show{opacity:1;pointer-events:auto}
#replay:focus-visible{outline:3px solid #0f1030;outline-offset:3px}
</style>
</head>
<body>
<div id="stage">
 <div id="sky"></div><div id="sun"></div><div id="ground"></div>
 <div id="bar"></div>
 <div id="text">
  <div class="line">Ainda está escuro.</div>
  <div class="line">Mas todo dia começa assim.</div>
  <div class="line">Um passo.<br>Depois outro.</div>
  <div class="line">Você já foi mais longe do que imagina.</div>
  <div class="line" style="color:#0f1030">Levanta.<br>Começa agora.<small>O sol não pede permissão.</small></div>
 </div>
 <button id="replay">Ver de novo</button>
</div>
<script>
const lines=[...document.querySelectorAll('.line')],T=[0,3,6,9.5,12.5],END=15;
const sun=document.getElementById('sun'),sky=document.getElementById('sky'),bar=document.getElementById('bar'),btn=document.getElementById('replay');
let timers=[],anims=[];
function play(){
 timers.forEach(clearTimeout);anims.forEach(a=>a.cancel());timers=[];anims=[];
 btn.classList.remove('show');lines.forEach(l=>l.classList.remove('on'));
 const o={duration:END*1000,fill:'forwards',easing:'cubic-bezier(.4,0,.2,1)'};
 anims.push(sun.animate([{transform:'translate(-50%,85%)'},{transform:'translate(-50%,-35%)'}],o));
 anims.push(sky.animate([{opacity:0},{opacity:0,offset:.55},{opacity:1}],o));
 anims.push(bar.animate([{width:'0%'},{width:'100%'}],{duration:END*1000,fill:'forwards',easing:'linear'}));
 lines.forEach((l,i)=>{
  timers.push(setTimeout(()=>l.classList.add('on'),T[i]*1000+50));
  if(i<lines.length-1)timers.push(setTimeout(()=>l.classList.remove('on'),(T[i+1]-.1)*1000));
 });
 timers.push(setTimeout(()=>btn.classList.add('show'),END*1000));
}
btn.onclick=play;play();
</script>
</body>
</html>
